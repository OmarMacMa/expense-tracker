name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_call:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: expense_tracker_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/expense_tracker_test
      JWT_SECRET: ci-test-secret
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Format check (black)
        working-directory: backend
        run: black --check .

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npx eslint .

      - name: Format check (prettier)
        working-directory: frontend
        run: npx prettier --check .

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install chart browser tooling
        run: |
          pip install -r frontend/browser_tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Chart geometry and tooltip regressions
        env:
          CHART_ARTIFACTS: ${{ runner.temp }}/chart-artifacts
        run: python -m pytest frontend/browser_tests -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-browser-evidence
          path: ${{ runner.temp }}/chart-artifacts

  invite-browser:
    name: Invite recovery (real backend + browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: invite_browser_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/invite_browser_test
      JWT_SECRET: ci-browser-test-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test tooling
        working-directory: backend
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Migrate isolated test database
        working-directory: backend
        run: alembic upgrade head
      - name: Browser regressions
        working-directory: backend
        run: python -m pytest browser_tests -v --basetemp=browser-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: invite-browser-failure
          path: backend/browser-artifacts
